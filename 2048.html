<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>2048 | Pražské služby</title>
<style>
:root{--green:#009645;--green-dark:#007a38;--orange:#F27D00;--bg:#f4f6f5;--board:#c9ddd1;--cell:#e3eee7;--ink:#1d1d1d}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Arial,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior:none}
header{background:var(--green);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px}
.logo{width:38px;height:38px;border-radius:8px;background:#fff;color:var(--green);font-weight:900;display:grid;place-items:center;font-size:16px;letter-spacing:-1px}
header h1{margin:0;font-size:18px}
header .sub{font-size:12px;opacity:.9}
.stripe{height:5px;background:var(--orange)}
main{max-width:480px;margin:0 auto;padding:18px 14px 30px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.big{font-size:52px;font-weight:900;color:var(--green);line-height:1;flex:1}
.score{background:var(--green);color:#fff;border-radius:8px;padding:6px 12px;text-align:center;min-width:76px}
.score.b{background:var(--orange)}
.score small{display:block;font-size:10px;letter-spacing:.5px;opacity:.9}
.score b{font-size:20px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;color:#5A5A5A;gap:10px}
button{background:var(--green);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:bold;font-size:14px;cursor:pointer}
button:hover{background:var(--green-dark)}
button.or{background:var(--orange)}
.board{position:relative;background:var(--board);border-radius:10px;padding:var(--gap);--gap:10px;width:100%;aspect-ratio:1;touch-action:none;user-select:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);height:100%}
.grid div{background:var(--cell);border-radius:6px}
.tiles{position:absolute;inset:var(--gap)}
.tile{position:absolute;width:calc((100% - 3*var(--gap))/4);height:calc((100% - 3*var(--gap))/4);border-radius:6px;display:grid;place-items:center;font-weight:900;transition:left .11s ease,top .11s ease;font-size:clamp(18px,8vw,40px)}
.tile.new{animation:pop .18s ease}
.tile.merged{animation:bump .18s ease}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes bump{50%{transform:scale(1.14)}}
.overlay{position:absolute;inset:0;border-radius:10px;background:rgba(244,246,245,.82);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5}
.overlay.on{display:flex}
.overlay h2{margin:0;font-size:34px;color:var(--green)}
.help{font-size:13px;color:#5A5A5A;line-height:1.6;margin-top:16px}
.claim{text-align:center;font-size:11px;letter-spacing:2px;color:var(--orange);font-weight:bold;margin-top:18px}
</style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#009645">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PS nástroje">
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'));</script>
</head>
<body>
<header>
  <div class="logo">PS</div>
  <div><h1>2048</h1><div class="sub">Pražské služby a.s. · chvilka na oddech</div></div>
</header>
<div class="stripe"></div>
<main>
  <div class="top">
    <div class="big">2048</div>
    <div class="score"><small>SKÓRE</small><b id="score">0</b></div>
    <div class="score b"><small>REKORD</small><b id="best">0</b></div>
  </div>
  <div class="bar">
    <span>Spojujte dlaždice a dojděte k <b>2048</b>!</span>
    <span style="display:flex;gap:6px"><button class="or" id="undo" title="Vrátit tah">↶</button><button id="new">Nová hra</button></span>
  </div>
  <div class="board" id="board">
    <div class="grid"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="over"><h2 id="msg">Konec hry</h2><div style="display:flex;gap:8px"><button id="cont" class="or">Hrát dál</button><button id="again">Znovu</button></div></div>
  </div>
  <div class="help">Ovládání: šipky nebo WASD, na mobilu tažení prstem. Dvě stejná čísla se spojí v jedno. Tlačítkem ↶ vrátíte poslední tah.</div>
  <div class="claim">NEPŘEKONATELNÝ SERVIS</div>
</main>
<script>
const COLORS = {
  2:['#e8f5ee','#1d5c3a'],4:['#c8e8d5','#1d5c3a'],8:['#fde3c4','#7a3f00'],16:['#f9c58a','#7a3f00'],
  32:['#f6a347','#fff'],64:['#F27D00','#fff'],128:['#80cba2','#fff'],256:['#40b074','#fff'],
  512:['#009645','#fff'],1024:['#007a38','#fff'],2048:['#004d23','#F27D00']
};
let grid, score, best = +(safeGet('ps2048best')||0), prev = null, won = false, keepGoing = false, nextId = 1;
const $ = id => document.getElementById(id);
function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function empty(){ const e=[]; for(let r=0;r<4;r++)for(let c=0;c<4;c++) if(!grid[r][c]) e.push([r,c]); return e; }
function add(){ const e=empty(); if(!e.length) return; const [r,c]=e[Math.random()*e.length|0]; grid[r][c]={v:Math.random()<.9?2:4,id:nextId++,isNew:true}; }
function start(){ grid=[...Array(4)].map(()=>Array(4).fill(null)); score=0; won=false; keepGoing=false; prev=null; add(); add(); $('over').classList.remove('on'); draw(); }

function clone(){ return { g: grid.map(r=>r.map(t=>t&&{v:t.v,id:t.id})), s: score }; }

function move(dir){ // 0 vlevo,1 nahoru,2 vpravo,3 dolů
  if ($('over').classList.contains('on')) return;
  const snap = clone(); let moved=false;
  for (let i=0;i<4;i++){
    const line=[]; for(let j=0;j<4;j++){ const [r,c]=pos(dir,i,j); line.push(grid[r][c]); }
    const tiles=line.filter(Boolean).map(t=>{t.isNew=false;t.merged=false;return t;}), out=[];
    for (let k=0;k<tiles.length;k++){
      if (k+1<tiles.length && tiles[k].v===tiles[k+1].v){ const v=tiles[k].v*2; score+=v; out.push({v,id:nextId++,merged:true}); k++; if(v===2048 && !keepGoing) won=true; }
      else out.push(tiles[k]);
    }
    while(out.length<4) out.push(null);
    for(let j=0;j<4;j++){ const [r,c]=pos(dir,i,j); if((grid[r][c]&&grid[r][c].id)!==(out[j]&&out[j].id)) moved=true; grid[r][c]=out[j]; }
  }
  if (!moved) return;
  prev = snap; add();
  if (score>best){ best=score; safeSet('ps2048best',best); }
  draw();
  if (won && !keepGoing){ $('msg').textContent='Máte 2048! 🎉'; $('cont').style.display=''; $('over').classList.add('on'); }
  else if (!canMove()){ $('msg').textContent='Konec hry'; $('cont').style.display='none'; $('over').classList.add('on'); }
}
function pos(dir,i,j){ return dir===0?[i,j]:dir===2?[i,3-j]:dir===1?[j,i]:[3-j,i]; }
function canMove(){
  if (empty().length) return true;
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){ const v=grid[r][c].v; if((c<3&&grid[r][c+1].v===v)||(r<3&&grid[r+1][c].v===v)) return true; }
  return false;
}

function draw(){
  const box=$('tiles'), seen=new Set();
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const t=grid[r][c]; if(!t) continue; seen.add(String(t.id));
    let el=box.querySelector(`[data-id="${t.id}"]`);
    if(!el){ el=document.createElement('div'); el.dataset.id=t.id; el.className='tile'+(t.isNew?' new':'')+(t.merged?' merged':''); box.appendChild(el); }
    const [bg,fg]=COLORS[t.v]||['#002b14','#F27D00'];
    el.style.background=bg; el.style.color=fg; el.textContent=t.v;
    el.style.fontSize = t.v>=1024 ? 'clamp(14px,6vw,30px)' : t.v>=128 ? 'clamp(16px,7vw,34px)' : '';
    el.style.left=`calc(${c} * (100% + var(--gap)) / 4)`; el.style.top=`calc(${r} * (100% + var(--gap)) / 4)`;
  }
  box.querySelectorAll('.tile').forEach(el=>{ if(!seen.has(el.dataset.id)) el.remove(); });
  $('score').textContent=score; $('best').textContent=best;
}

document.addEventListener('keydown',e=>{
  const m={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3,a:0,w:1,d:2,s:3,A:0,W:1,D:2,S:3}[e.key];
  if(m!==undefined){ e.preventDefault(); move(m); }
});
let sx,sy;
const b=$('board');
b.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
b.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
b.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<25) return;
  move(Math.abs(dx)>Math.abs(dy) ? (dx<0?0:2) : (dy<0?1:3));
});
$('new').onclick=$('again').onclick=start;
$('cont').onclick=()=>{ keepGoing=true; won=false; $('over').classList.remove('on'); };
$('undo').onclick=()=>{ if(!prev) return; grid=prev.g; score=prev.s; prev=null; $('tiles').innerHTML=''; $('over').classList.remove('on'); draw(); };
start();
</script>
</body>
</html>
